name: munka_warehouse
version: '1.0.0'
config-version: 2

profile: munka_warehouse

model-paths: ["models"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  raw_database: "{{ env_var('DBT_SNOWFLAKE_DATABASE', 'DRAGON_DB') }}"
  raw_schema: "{{ env_var('DBT_SNOWFLAKE_SCHEMA', 'MUNKA_RAW') }}"

models:
  munka_warehouse:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: munka_stg
    intermediate:
      +materialized: view
      +schema: munka_int
    marts:
      gold:
        +materialized: table
        +schema: munka_gold
      ml:
        +materialized: table
        +schema: munka_ml

seeds:
  munka_warehouse:
    +schema: munka_raw
    analise_retrospectiva:
      +schema: munka_ml
      +column_types:
        TAREFA_ID: varchar(255)
        FONTE_DADOS: varchar(50)
        HORAS_EXECUTADAS: float
        HORAS_ESTIMADAS_SKLEARN: float
        HORAS_ESTIMADAS_NUMPY: float
        ERRO_SKLEARN: float
        ERRO_ABSOLUTO_SKLEARN: float
        ERRO_QUADRATICO_SKLEARN: float
        ERRO_PERCENTUAL_SKLEARN: float
        ERRO_NUMPY: float
        ERRO_ABSOLUTO_NUMPY: float
        ERRO_QUADRATICO_NUMPY: float
        ERRO_PERCENTUAL_NUMPY: float
        DIFERENCA_MODELOS: float
        MODELO_MAIS_PROXIMO: varchar(50)
        MODEL_SCOPE: varchar(100)
        FEATURE_SET_NAME: varchar(100)
        DATA_ANALISE: timestamp_ntz